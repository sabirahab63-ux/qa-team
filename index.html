<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q and A Team | Proposal, Capture & Business Development</title>
    <meta
      name="description"
      content="Business development, capture management, proposal development, teaming, and contract vehicle support for federal and state government contracting, including RFPs, RFQs, and RFIs."
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Q and A Team" />
    <meta
      property="og:description"
      content="From first opportunity to final submission, one integrated team."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/jpeg" href="/assets/logo.jpeg" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
